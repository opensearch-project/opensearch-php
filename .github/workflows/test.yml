name: PHP

on:
  push:
    paths:
      - "**.php"
  pull_request:

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Use PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          extensions: yaml, zip, curl
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer install --prefer-dist

      - name: PHP CS Fixer
        run: |
          composer run-script php-cs

  static-analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Use PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          extensions: yaml, zip, curl
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer install --prefer-dist

      - name: PHP Static Analysis Tool
        run: |
          composer run-script phpstan

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      search-server:
        image: index.docker.io/opensearchproject/opensearch@sha256:123e6591a47b1d54686890551bdb35739c85193ecded381219fc9e059e18128f # ratchet:opensearchproject/opensearch:3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          plugins.security.disabled: true
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: myStrongPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Use PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: 8.3
          extensions: yaml, zip, curl, pcov
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer install --prefer-dist

      - name: Wait for cluster to be healthy
        uses: ./.github/actions/health-check

      - name: PHPUnit
        run: |
          composer run-script phpunit
        env:
          OPENSEARCH_URL: 'http://localhost:9200'

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # ratchet:codecov/codecov-action@v7.0.0
        with:
          file: ./clover.xml

  unit-test:
    name: "Unit Test"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Use PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: yaml, zip, curl
        coverage: xdebug
      env:
        COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: |
        composer install --prefer-dist

    - name: Unit tests
      run: |
        composer run unit

  integration-test-opensearch:
    name: Integration Test (OpenSearch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        search-server-image:
          - opensearchproject/opensearch:2
          - opensearchproject/opensearch:3
        prefer-lowest: ["--prefer-lowest", ""]
    services:
      search-server:
        image: ${{ matrix.search-server-image }}
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          plugins.security.disabled: true
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: myStrongPassword123!

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Use PHP 8.3
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
      with:
        php-version: 8.3
        extensions: yaml, zip, curl
      env:
        COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
   
    - name: Install dependencies
      run: |
        composer update --with-all-dependencies --no-progress --prefer-dist ${{ matrix.prefer-lowest }}

    - name: Wait for cluster to be healthy
      uses: ./.github/actions/health-check

    - name: Integration tests
      run: |
        composer run integration
      env:
        OPENSEARCH_URL: 'http://localhost:9200'
